[package]
name = "broski-link-power"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[dependencies]
# one-line error enum for the platform failure modes
thiserror = "2.0.21"
# tracing 0.1.44 — a monitor thread that would not stop is reported in the daemon's log.
tracing = "0.1.44"

[target.'cfg(target_os = "macos")'.dependencies]
# CFRunLoop / CFString / CFArray / CFDictionary / CFNumber, which the IOKit bindings build on
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFArray",
    "CFDate",
    "CFDictionary",
    "CFNumber",
    "CFRunLoop",
    "CFString",
] }
# IORegisterForSystemPower, IOPMAssertionCreateWithName, IOPSCopyPowerSourcesInfo
objc2-io-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "ps",
    "pwr_mgt",
] }
