[workspace]
resolver = "2"
members = [
    "crypto",
    "proto",
    "core",
    "relay",
    "power",
    "daemon",
    "contract",
    "session",
    "testkit",
    "client",
    "mobile",
    "uniffi-bindgen",
]

[workspace.package]
edition = "2021"
license = "MIT"

# crypto keeps debug symbols in release builds for its benchmarks; a workspace has
# one profile table, so it lives at the root.
[profile.release]
debug = true

# The libraries the apps ship (scripts/build-{ios,android}-core.sh): no debug info, and one
# optimisation unit across every crate.
[profile.mobile]
inherits = "release"
debug = false
lto = true
codegen-units = 1
