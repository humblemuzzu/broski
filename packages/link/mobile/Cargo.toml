[package]
name = "broski-mobile"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "BroskiCore: the phone's client core the iOS and Android apps call through UniFFI"

[lib]
name = "broski_core"
# staticlib for the iOS XCFramework, cdylib for Android and for library-mode bindgen on the host,
# lib for this crate's own tests.
crate-type = ["lib", "staticlib", "cdylib"]
doctest = false

[dependencies]
broski-client = { path = "../client" }
broski-contract = { path = "../contract", features = ["uniffi"] }
broski-link-session = { path = "../session" }
broski-render = { path = "../render" }
broski-voice = { path = "../voice" }
# uniffi =0.32.2 — exact: the bindgen in ../uniffi-bindgen must be the same version.
uniffi = "=0.32.2"
# zeroize 1.8.2 — the same pin the session uses; wipes the offer the scanner hands in.
zeroize = "1.8.2"

[dev-dependencies]
# broski-link-testkit — the real daemon and bridge the exported API is driven against.
broski-link-testkit = { path = "../testkit" }
# tokio 1.53.2 — the session's pin; runs the async exports in this crate's tests.
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync"] }
