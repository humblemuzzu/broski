[package]
name = "broski-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The phone apps' client core: the contract over Broski Link, session views, catalogs, the inbox and terminals"

[lib]
doctest = false

[dependencies]
broski-contract = { path = "../contract" }
broski-link-session = { path = "../session" }
# tokio 1.53.2 — the session crate's pin: channels, Notify and timers on its LinkRuntime.
tokio = { version = "1.53.2", features = ["rt", "time", "sync", "macros"] }
# base64 0.22.1 — the session crate's pin; terminal input and output travel as base64.
base64 = "0.22.1"
# serde_json 1.0.151 — the contract crate's pin; names an unexpected answer by its wire type.
serde_json = "1.0.151"
# thiserror 2.0.21 — the session crate's pin; derives the one public error enum.
thiserror = "2.0.21"
# tracing 0.1.44 — the session crate's pin; debug logs that never carry a payload.
tracing = "0.1.44"

[dev-dependencies]
# broski-link-testkit — the real daemon and relay in-process, and a LAN path the tests cut.
broski-link-testkit = { path = "../testkit" }
# tokio 1.53.2 — the tests' own runtime, and the Bun bridge as a child process.
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "io-util"] }
# tempfile 3.27.0 — a temp home for the bridge and a temp git repository.
tempfile = "3.27.0"
# tracing-subscriber 0.3.23 — RUST_LOG for a failing test; the pin the daemon uses.
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
