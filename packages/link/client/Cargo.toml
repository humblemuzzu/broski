[package]
name = "broski-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The phone apps' client core: the contract over Broski Link, session views, catalogs, the inbox and terminals"

[lib]
doctest = false

[dependencies]
broski-contract = { path = "../contract" }
broski-link-session = { path = "../session" }
broski-screen = { path = "../screen" }
# tokio 1.54.1 — the session crate's pin: channels, Notify and timers on its LinkRuntime.
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
# base64 0.22.1 — the session crate's pin; terminal input and output travel as base64.
base64 = "0.22.1"
# serde 1.0.229 — the contract crate's pin; derives the inbox cache's stored form.
serde = { version = "1.0.229", features = ["derive"] }
# serde_json 1.0.154 — the contract crate's pin; names an unexpected answer by its wire type and
# writes the inbox cache.
serde_json = "1.0.154"
# thiserror 2.0.21 — the session crate's pin; derives the one public error enum.
thiserror = "2.0.21"
# tracing 0.1.44 — the session crate's pin; debug logs that never carry a payload.
tracing = "0.1.44"
# zeroize 1.9.2 — the session crate's pin; wipes the identity secret and the offer the app hands in.
zeroize = "1.9.2"

[dev-dependencies]
# broski-link-testkit — the real daemon, relay and bridge, and a LAN path the tests cut.
broski-link-testkit = { path = "../testkit" }
# broski-screen test-server — real RFB 3.8 + Apple 003.889 loopback server for e2e tests.
broski-screen = { path = "../screen", features = ["test-server"] }
# tokio 1.54.1 — the tests' own runtime.
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
# tracing-subscriber 0.3.23 — RUST_LOG for a failing test; the pin the daemon uses.
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
