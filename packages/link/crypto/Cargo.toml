[package]
name = "broski-link-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
doctest = false

[dependencies]
base64 = "0.22.1"
clatter = { version = "=2.2.0", default-features = false, features = [
    "alloc",
    "getrandom",
    "use-25519",
    "use-aes-gcm",
    "use-rust-crypto-ml-kem",
    "use-sha",
] }
sha2 = "0.10.9"
thiserror = "2.0.17"
zeroize = "1.8.2"
