[package]
name = "broski-contract"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The Broski backend contract for the phone core: generated models and the session reducer"

[lib]
doctest = false

[features]
uniffi = ["dep:uniffi"]

[dependencies]
# serde 1.0.229 — the same pin the daemon uses; derives the wire codec of every model.
serde = { version = "1.0.229", features = ["derive"] }
# serde_json 1.0.151 — the same pin the daemon uses; reads and writes contract frames.
serde_json = "1.0.151"
# thiserror 2.0.21 — the same pin core and proto use; derives the frame error.
thiserror = "2.0.21"
# uniffi =0.32.2 — exact: the bindgen that reads this crate must be the same version.
uniffi = { version = "=0.32.2", optional = true }

[dev-dependencies]
# sha2 0.10.9 — the same pin crypto uses; hashes the reducer trace's large snapshots.
sha2 = "0.10.9"
