[package]
name = "broski-link-testkit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Test harness for the phone-side crates: the real daemon and relay in-process, and a LAN path a test controls"

[lib]
doctest = false

[dependencies]
broski-link-core = { path = "../core" }
# broski-link-daemon — the real machine side every phone test talks to.
broski-link-daemon = { path = "../daemon" }
# broski-relay — the real relay, in-process on a loopback port.
broski-relay = { path = "../relay" }
# tokio 1.53.2 — the daemon's control socket, the relay listener and the forwarder's sockets.
tokio = { version = "1.53.2", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
# tempfile 3.27.0 — a private home per daemon and a database per relay.
tempfile = "3.27.0"
# serde_json 1.0.151 — the daemon's control socket speaks JSON lines.
serde_json = "1.0.151"
