[package]
name = "broski-link-testkit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Test harness for the phone-side crates: the real daemon and relay in-process, a LAN path a test controls, and the real bridge"

[lib]
doctest = false

[dependencies]
# broski-contract — the session refs the fake bridge's commands take and answer.
broski-contract = { path = "../contract" }
broski-link-core = { path = "../core" }
# broski-link-daemon — the real machine side every phone test talks to.
broski-link-daemon = { path = "../daemon" }
# broski-relay — the real relay, in-process on a loopback port.
broski-relay = { path = "../relay" }
# tokio 1.53.2 — the daemon's control socket, the relay listener, the forwarder's sockets, the
# bridge as a child process, and test-machine's stdin.
tokio = { version = "1.53.2", features = ["rt", "net", "time", "sync", "macros", "io-util", "process", "io-std"] }
# tempfile 3.27.0 — a private home per daemon and a database per relay.
tempfile = "3.27.0"
# serde_json 1.0.151 — the daemon's control socket speaks JSON lines.
serde_json = "1.0.151"
