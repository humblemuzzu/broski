[versions]
agp = "9.5.1"
kotlin = "2.4.21"
android-compileSdk = "36"
android-minSdk = "26"
# r28 links 16 KB page-aligned libraries by default; scripts/build-android-core.sh builds with it.
android-ndk = "28.2.13676358"
androidx-annotation = "1.11.0"
# 5.17.0 is the first whose libjnidispatch.so is 16 KB aligned on both arm64-v8a and x86_64.
jna = "5.19.1"
junit = "4.13.2"
kotlinx-coroutines = "1.11.0"

[libraries]
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
