name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos-bridge:
    name: macOS Bridge & Daemon
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/link
      - name: Install bridge dependencies
        working-directory: packages/bridge
        run: bun install --frozen-lockfile
      - name: Build macOS binaries (arm64 + x64)
        working-directory: packages/bridge
        run: sh scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: |
            packages/bridge/dist/broski-darwin-arm64
            packages/bridge/dist/broski-darwin-arm64.gz
            packages/bridge/dist/broski-darwin-arm64.tar.xz
            packages/bridge/dist/broski-darwin-x64
            packages/bridge/dist/broski-darwin-x64.gz
            packages/bridge/dist/broski-darwin-x64.tar.xz
            packages/bridge/dist/broski-link-darwin-arm64
            packages/bridge/dist/broski-link-darwin-arm64.gz
            packages/bridge/dist/broski-link-darwin-arm64.tar.xz
            packages/bridge/dist/broski-link-darwin-x64
            packages/bridge/dist/broski-link-darwin-x64.gz
            packages/bridge/dist/broski-link-darwin-x64.tar.xz
            packages/bridge/dist/libbroski_pty.dylib
          if-no-files-found: error

  android-apk:
    name: Android Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/link
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Install Android SDK packages
        run: |
          ndk="$(sed -n 's/^android-ndk = "\(.*\)"$/\1/p' apps/android/gradle/libs.versions.toml)"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build BroskiCore for Android
        run: scripts/build-android-core.sh
      - uses: actions/cache@v4
        with:
          path: ~/.cache/broski
          key: android-terminal-${{ hashFiles('scripts/build-android-terminal.sh') }}
      - name: Build Android terminal native library
        run: scripts/build-android-terminal.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore (when configured)
        env:
          KEYSTORE_B64: ${{ secrets.BROSKI_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/broski-release.jks"
            echo "BROSKI_ANDROID_KEYSTORE=$RUNNER_TEMP/broski-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        working-directory: apps/android
        env:
          BROSKI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BROSKI_ANDROID_KEYSTORE_PASSWORD }}
          BROSKI_ANDROID_KEY_ALIAS: ${{ secrets.BROSKI_ANDROID_KEY_ALIAS }}
          BROSKI_ANDROID_KEY_PASSWORD: ${{ secrets.BROSKI_ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease
          mkdir -p "$RUNNER_TEMP/android-dist"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/android-dist/broski-android-arm64.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/android-dist/broski-android-arm64-unsigned.apk"
          fi
      - name: Verify 16 KB page alignment
        run: |
          apk="$(ls "$RUNNER_TEMP/android-dist/"*.apk | head -1)"
          scripts/check-android-alignment.sh "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-dist
          path: ${{ runner.temp }}/android-dist/*.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [macos-bridge, android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-dist
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: android-dist
          path: release-assets
      - name: Add the installer `broski update` runs
        run: cp packages/bridge/scripts/install.sh release-assets/install.sh
      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS
      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          awk -v prefix="## $TAG" '
            index($0, prefix) == 1 && (length($0) == length(prefix) || substr($0, length(prefix) + 1, 1) == " ") {
              found = 1
              next
            }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            if [ "${{ steps.notes.outputs.has_notes }}" = "true" ]; then
              gh release edit "$TAG" --notes-file release-notes.md
            fi
          else
            # Published only once every asset is up: installers and updaters follow releases/latest at once.
            if [ "${{ steps.notes.outputs.has_notes }}" = "true" ]; then
              gh release create "$TAG" release-assets/* --draft --title "Broski $TAG" --notes-file release-notes.md
            else
              gh release create "$TAG" release-assets/* --draft --title "Broski $TAG" --generate-notes
            fi
            gh release edit "$TAG" --draft=false --latest
          fi
