name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bridge:
    name: Bridge checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/bridge
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bunx biome check src/ scripts/ --diagnostic-level=error
      - name: Contract layers
        run: bun run check:layers
      - name: Generated contract is current
        run: bun run contract:check
      - name: Test
        run: bun test
      - name: Perf budget (synthetic, 3 runs)
        env:
          BENCH_SERVER_IDLE_MS: "8000"
        run: |
          for i in 1 2 3; do
            bun bench/run.ts --out=/tmp/broski-bench-$i.json \
              --filter=startup-version,module-load,server-idle,pty-main-thread-stall
          done
          bun bench/check-budget.ts /tmp/broski-bench-1.json /tmp/broski-bench-2.json /tmp/broski-bench-3.json

  link:
    name: Broski Link (Rust)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/link
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/link
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The workspace builds the contract with its UniFFI derives (broski-mobile turns them on);
      # this lints it as the crates that leave them off build it.
      - name: Clippy (contract without its UniFFI derives)
        run: cargo clippy -p broski-contract --all-targets -- -D warnings
      # The client's tests run the real bridge (Bun, the dev fake bridge) on the daemon's socket.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Bridge dependencies
        working-directory: packages/bridge
        run: bun install --frozen-lockfile
      - name: Test
        run: cargo test --workspace

  ios-core:
    name: BroskiCore for iOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/link
      - name: Build the XCFramework and the Swift bindings
        run: scripts/build-ios-core.sh
      # One host test pairs with a real daemon and bridge (testkit's test-machine, Bun's fake bridge).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Bridge dependencies
        working-directory: packages/bridge
        run: bun install --frozen-lockfile
      - name: Swift tests on the host
        working-directory: apps/ios/BroskiCore
        run: swift test -Xswiftc -warnings-as-errors
      - name: Build and link for the iOS simulator
        working-directory: apps/ios/BroskiCore
        run: xcodebuild build-for-testing -scheme BroskiCore -destination 'generic/platform=iOS Simulator'
      - name: Build and link for iOS devices
        working-directory: apps/ios/BroskiCore
        run: xcodebuild build-for-testing -scheme BroskiCore -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO

  android-core:
    name: BroskiCore for Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/link
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Install the SDK packages
        run: |
          ndk="$(sed -n 's/^android-ndk = "\(.*\)"$/\1/p' apps/android/gradle/libs.versions.toml)"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" "platforms;android-36" "build-tools;36.0.0"
      - name: Build the core libraries and the Kotlin bindings
        run: scripts/build-android-core.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble the library and run the JVM tests
        working-directory: apps/android
        run: ./gradlew :core:assembleDebug :core:assembleRelease :core:testDebugUnitTest
      - name: Native libraries are 16 KB aligned
        run: scripts/check-android-alignment.sh apps/android/core/build/outputs/aar/core-release.aar
