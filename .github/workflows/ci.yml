name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bridge:
    name: Bridge checks
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/bridge
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bunx biome check src/ scripts/ --diagnostic-level=error
      - name: Contract layers
        run: bun run check:layers
      - name: Generated contract is current
        run: bun run contract:check
      - name: Test
        run: bun test
      - name: Perf budget (synthetic, 3 runs)
        env:
          BENCH_SERVER_IDLE_MS: "8000"
        run: |
          for i in 1 2 3; do
            bun bench/run.ts --out=/tmp/broski-bench-$i.json \
              --filter=startup-version,module-load,server-idle,pty-main-thread-stall
          done
          bun bench/check-budget.ts /tmp/broski-bench-1.json /tmp/broski-bench-2.json /tmp/broski-bench-3.json

  link:
    name: Broski Link (Rust)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/link
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/link
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The workspace builds the contract with its UniFFI derives (broski-mobile turns them on);
      # this lints it as the crates that leave them off build it.
      - name: Clippy (contract without its UniFFI derives)
        run: cargo clippy -p broski-contract --all-targets -- -D warnings
      # The client's tests run the real bridge (Bun, the dev fake bridge) on the daemon's socket.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Bridge dependencies
        working-directory: packages/bridge
        run: bun install --frozen-lockfile
      - name: Test
        run: cargo test --workspace

  agent-text:
    name: Agent text through the formatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every direct read of agent text is drawn by the formatter
        run: scripts/check-agent-text.sh

  ios-core:
    name: BroskiCore for iOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/link
      - name: Build the XCFramework and the Swift bindings
        run: scripts/build-ios-core.sh
      # One host test pairs with a real daemon and bridge (testkit's test-machine, Bun's fake bridge).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Bridge dependencies
        working-directory: packages/bridge
        run: bun install --frozen-lockfile
      - name: Swift tests on the host
        working-directory: apps/ios/BroskiCore
        run: swift test -Xswiftc -warnings-as-errors
      - name: Build and link for the iOS simulator
        working-directory: apps/ios/BroskiCore
        run: xcodebuild build-for-testing -scheme BroskiCore -destination 'generic/platform=iOS Simulator'
      - name: Build and link for iOS devices
        working-directory: apps/ios/BroskiCore
        run: xcodebuild build-for-testing -scheme BroskiCore -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO

  ios-app:
    name: Broski for iOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/link
      - name: Install XcodeGen
        run: brew install xcodegen
      # BroskiCore is built by the script first; warnings are errors in the project.
      - name: Build for an iOS device
        run: scripts/build-ios-app.sh device --unsigned
      # A simulator of the newest iOS runtime on the image, whatever its devices are called.
      - name: Create a simulator
        run: |
          read -r runtime device < <(xcrun simctl list runtimes -j | /usr/bin/python3 -c '
          import json, sys
          runtimes = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          runtime = max(runtimes, key=lambda r: [int(part) for part in r["version"].split(".")])
          iphone = next(t for t in runtime["supportedDeviceTypes"] if t["productFamily"] == "iPhone")
          print(runtime["identifier"], iphone["identifier"])
          ')
          xcrun simctl create "Broski CI" "$device" "$runtime"
      - name: Unit tests in the simulator
        env:
          BROSKI_SIMULATOR: Broski CI
        run: scripts/build-ios-app.sh --test

  android-core:
    name: Android (BroskiCore and the app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/link
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Install the SDK packages
        run: |
          ndk="$(sed -n 's/^android-ndk = "\(.*\)"$/\1/p' apps/android/gradle/libs.versions.toml)"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build the core libraries and the Kotlin bindings
        run: scripts/build-android-core.sh
      - uses: actions/cache@v4
        with:
          path: ~/.cache/broski
          key: android-terminal-${{ hashFiles('scripts/build-android-terminal.sh') }}
      - name: Build libghostty-vt and the terminal's JNI shim (the script fetches the pinned Zig)
        run: scripts/build-android-terminal.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble the core library and run the core and terminal JVM tests
        working-directory: apps/android
        run: ./gradlew :core:assembleDebug :core:assembleRelease :core:testDebugUnitTest :terminal:testDebugUnitTest
      - name: Native libraries are 16 KB aligned
        run: scripts/check-android-alignment.sh apps/android/core/build/outputs/aar/core-release.aar
      - name: Build, test and lint the app
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lint
      - name: The app's native libraries are 16 KB aligned
        run: scripts/check-android-alignment.sh apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
