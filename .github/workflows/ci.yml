name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bridge:
    name: Bridge checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/bridge
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bunx biome check src/ scripts/ --diagnostic-level=error
      - name: Contract layers
        run: bun run check:layers
      - name: Generated contract is current
        run: bun run contract:check
      - name: Test
        run: bun test
      - name: Perf budget (synthetic, 3 runs)
        env:
          BENCH_SERVER_IDLE_MS: "8000"
        run: |
          for i in 1 2 3; do
            bun bench/run.ts --out=/tmp/broski-bench-$i.json \
              --filter=startup-version,module-load,server-idle,pty-main-thread-stall
          done
          bun bench/check-budget.ts /tmp/broski-bench-1.json /tmp/broski-bench-2.json /tmp/broski-bench-3.json

  link:
    name: Broski Link (Rust)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/link
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/link
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (contract with its UniFFI derives)
        run: cargo clippy -p broski-contract --all-targets --features uniffi -- -D warnings
      # The client's tests run the real bridge (Bun, the dev fake bridge) on the daemon's socket.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Bridge dependencies
        working-directory: packages/bridge
        run: bun install --frozen-lockfile
      - name: Test
        run: cargo test --workspace
